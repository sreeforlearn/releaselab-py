sonar.projectKey=releaselab-py
sonar.projectName=ReleaseLab Python
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Coverage report (Cobertura XML)
sonar.python.coverage.reportPaths=coverage.xml

# Unit test report (JUnit XML) — workflow lo reports/ lo generate avutundi
sonar.python.xunit.reportPath=reports/junit.xml

sonar.exclusions=**/__pycache__/**,reports/**
sonar.coverage.exclusions=tests/**
